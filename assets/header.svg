<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="htakumi08 — Build. Explore. Refine. Penguin Pixel Lab">
  <title>htakumi08 — Penguin Pixel Lab</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17142d"/><stop offset="1" stop-color="#30234f"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b5a2ff" stroke-opacity=".06" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="358" rx="8"/></clipPath>
  </defs>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,monospace}</style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/><rect width="1200" height="360" fill="url(#grid)"/>
    <rect x="46" y="38" width="206" height="28" rx="4" fill="#40345f" stroke="#a99be0" stroke-opacity=".65"/>
    <rect x="58" y="49" width="6" height="6" fill="#e8cf77"/><text x="76" y="57" class="mono" font-size="11" letter-spacing="1.6" fill="#eee9ff">PENGUIN PIXEL LAB</text>
    <text x="46" y="151" font-size="76" font-weight="750" letter-spacing="-3" fill="#fbf8ff">htakumi<tspan fill="#c9bdff">08</tspan></text>
    <text x="49" y="200" font-size="27" font-weight="500" fill="#eee9ff">Build. Explore. Refine.</text>
    <text x="50" y="244" class="mono" font-size="13" letter-spacing="2.2" fill="#c1b9dc">WEB / CLOUD / DEVELOPER TOOLS</text>
    <g fill="#776a9c"><rect x="50" y="277" width="12" height="4"/><rect x="66" y="277" width="8" height="4"/><rect x="78" y="277" width="4" height="4"/></g>

